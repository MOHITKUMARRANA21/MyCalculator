<!DOCTYPE html>
<html>
  <head>
    <title>
      Calculator v2
    </title>
    <link rel="stylesheet" href="csscode/calculator2.css">
  </head>
  <body>
    <div class="container">
      <div class="image">
        <button class="imageButton js-buttonimage"><img src="image/3dotimage.png" class="image1"></button>
      </div>
      <!-- Popup Menu -->
      <div class="popup-menu">
          <div class="menu-item js-menu1">📜 History</div>
          <div class="menu-item js-menu2">🎨 Theme</div>
      </div>
        <input placeholder="0" class="Input-value">
        <p class="paragraph1">
          90
        </p>
        <div class="Button-container">
          <div class="buttonSection1">
            <button class="ACButton">AC</button>
            <button>⌫</button>
            <button>%</button>
            <button>÷</button>
          </div>
          <div class="buttonSection2">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>
          </div>
          <div class="buttonSection3">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
          </div>
          <div class="buttonSection4">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
          </div>
          <div class="buttonSection5">
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalButton">=</button>
          </div>
      </div>
    </div>
    <script src="Javascriptcode/calculator2.js"></script>
  </body>
</html>
